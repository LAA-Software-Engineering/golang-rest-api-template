services:
  backend:
    container_name: go-rest-api-template
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_DB: go_app_dev
      POSTGRES_HOST: dockerPostgres
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: password
      POSTGRES_PORT: 5435
      # Load from a project-root `.env` file (Compose interpolates it) or from the shell environment.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set - copy .env.example to .env and fill secrets}
      API_SECRET_KEY: ${API_SECRET_KEY:?API_SECRET_KEY must be set - copy .env.example to .env and fill secrets}
      REDIS_HOST: redis
      MONGODB_URI: mongodb://mongo:27017
      # Enables HSTS/CSP and XSS middleware in pkg/api/router.go (Gin release mode).
      GIN_MODE: release
      # Optional domain event publishing. Defaults to "none" (no Kafka needed).
      # To enable: `EVENTS_DRIVER=kafka docker compose --profile kafka up`.
      EVENTS_DRIVER: ${EVENTS_DRIVER:-none}
      SERVICE_NAME: ${SERVICE_NAME:-golang-rest-api-template}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_TOPIC_PREFIX: ${KAFKA_TOPIC_PREFIX:-app}
      KAFKA_PUBLISH_TIMEOUT: ${KAFKA_PUBLISH_TIMEOUT:-2s}

  db:
    image: postgres:14.17-alpine
    restart: always
    container_name: dockerPostgres
    volumes:
      # Named volume (aligned with mongo_data); avoids bind-mounting ./.dbdata into the image context.
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5435:5435"
    environment:
      - POSTGRES_DB=go_app_dev
      - POSTGRES_USER=docker
      - POSTGRES_PASSWORD=password
    command: -p 5435
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docker -d go_app_dev -p 5435"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4.2-alpine
    ports:
      - "127.0.0.1:6379:6379"
    container_name: dockerRedis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  mongo:
    image: mongo:7.0.15
    container_name: dockerMongo
    volumes:
      - mongo_data:/data/db
    ports:
      - "127.0.0.1:27017:27017"
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # Optional: single-node Kafka (KRaft, no ZooKeeper). Opt-in via the "kafka"
  # profile so the default `docker compose up` stays lean and Kafka-free:
  #   EVENTS_DRIVER=kafka docker compose --profile kafka up
  # In-cluster clients (the backend) use kafka:9092; host clients (the example
  # consumer via `go run ./examples/kafka-consumer`) use localhost:29092.
  kafka:
    image: apache/kafka:3.9.0
    container_name: dockerKafka
    profiles: ["kafka"]
    ports:
      - "127.0.0.1:29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  mongo_data:
  postgres_data:
