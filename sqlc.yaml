version: "2"
sql:
  - engine: "postgresql"
    schema: "pkg/database/schema.sql"
    queries: "pkg/repository/queries"
    gen:
      go:
        package: "dbsqlc"
        out: "pkg/repository/dbsqlc"
        sql_package: "pgx/v5"
        emit_json_tags: false
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
